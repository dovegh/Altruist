# Builds the Android APK and the iOS app on GitHub's machines — no Expo account.
#
# Runs on every push to main, on version tags (v1.2.3), and by hand from the
# Actions tab ("Run workflow"). Download the results from the run's
# "Artifacts" section.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   EXPO_PUBLIC_SUPABASE_URL        required — https://<ref>.supabase.co
#   EXPO_PUBLIC_SUPABASE_ANON_KEY   required — the PUBLISHABLE key (sb_publishable_…)
#                                   Never the service_role key: EXPO_PUBLIC_* ends
#                                   up readable inside the app.
#
# Optional — a proper Android release key instead of the shared debug key:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#
# What comes out:
#   altruist-android-apk   Installable on any Android phone. Signed with the debug
#                          key unless the ANDROID_KEYSTORE_* secrets are set —
#                          fine for testing, not for the Play Store.
#   altruist-ios-unsigned  An unsigned .ipa. Apple only installs signed apps; sign
#                          it for your own devices with Sideloadly / AltStore and
#                          a free Apple ID, or add Apple signing to this job later.
#   altruist-ios-simulator The .app for the iOS Simulator on a Mac.

name: Build apps

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Write .env from secrets
        env:
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Set the EXPO_PUBLIC_SUPABASE_URL and EXPO_PUBLIC_SUPABASE_ANON_KEY repository secrets."
            exit 1
          fi
          printf 'EXPO_PUBLIC_SUPABASE_URL=%s\nEXPO_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_KEY" > .env

      - name: Generate the native project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Use the release key, if one is configured
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No release key configured — the APK is signed with the debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          cat >> android/gradle.properties <<EOF
          ALTRUIST_RELEASE_STORE_FILE=release.keystore
          ALTRUIST_RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD
          ALTRUIST_RELEASE_KEY_ALIAS=$KEY_ALIAS
          ALTRUIST_RELEASE_KEY_PASSWORD=$KEY_PASSWORD
          EOF
          # Point the release build at it (the generated file signs release with debug).
          python3 - <<'PY'
          import re
          p = "android/app/build.gradle"
          s = open(p).read()
          s = s.replace(
              "signingConfigs {",
              """signingConfigs {
                  release {
                      storeFile file(ALTRUIST_RELEASE_STORE_FILE)
                      storePassword ALTRUIST_RELEASE_STORE_PASSWORD
                      keyAlias ALTRUIST_RELEASE_KEY_ALIAS
                      keyPassword ALTRUIST_RELEASE_KEY_PASSWORD
                  }""",
              1,
          )
          s = re.sub(r"(release \{[^{}]*?)signingConfig signingConfigs\.debug", r"\1signingConfig signingConfigs.release", s, count=1, flags=re.S)
          open(p, "w").write(s)
          PY

      - name: Build the APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          if ! ./gradlew assembleRelease --no-daemon 2>&1 | tee ../gradle.log; then
            # Logs need a GitHub sign-in to read; annotations do not.
            grep -E "error:|FAILURE:|What went wrong|> " ../gradle.log | head -25 | while IFS= read -r line; do
              echo "::error title=Gradle::${line}"
            done
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: altruist-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  ios:
    name: iOS (unsigned IPA + simulator)
    # Expo SDK 57's native layer targets Xcode 27. GitHub's Xcode 27 image is
    # in beta; if it misbehaves, switch to macos-26 (Xcode 26.6) and the step
    # "Let Expo's JSI layer build on Xcode 26" keeps it compiling.
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          # `latest`, not `latest-stable`: on the Xcode 27 image the newest
          # Xcode may still be a beta, and stable would fall back to 26.
          xcode-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Let Expo's JSI layer build on Xcode 26
        # expo-modules-jsi 57.0.5 annotated two RuntimeScheduler constructors
        # with SWIFT_RETURNS_RETAINED for Xcode 27's compiler; Xcode 26's
        # compiler rejects that annotation on a constructor. Removing it
        # restores what 57.0.4 shipped, which built on Xcode 26. It only
        # affects compile-time ownership checks. Skipped on Xcode 27+.
        run: |
          major=$(xcodebuild -version | awk '/^Xcode/{split($2,v,"."); print v[1]}')
          header=node_modules/expo-modules-jsi/apple/Sources/ExpoModulesJSI-Cxx/include/RuntimeScheduler.h
          if [ "$major" -ge 27 ]; then
            echo "Xcode $major: no patch needed."
          elif grep -q 'SWIFT_RETURNS_RETAINED RuntimeScheduler(' "$header"; then
            sed -i '' 's/SWIFT_RETURNS_RETAINED RuntimeScheduler(/RuntimeScheduler(/' "$header"
            echo "::notice title=Xcode $major::Removed Xcode 27-only SWIFT_RETURNS_RETAINED from RuntimeScheduler constructors."
          fi

      - name: Write .env from secrets
        env:
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Set the EXPO_PUBLIC_SUPABASE_URL and EXPO_PUBLIC_SUPABASE_ANON_KEY repository secrets."
            exit 1
          fi
          printf 'EXPO_PUBLIC_SUPABASE_URL=%s\nEXPO_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_KEY" > .env

      - name: Generate the native project and install pods
        run: npx expo prebuild --platform ios --clean

      - name: Find the workspace and scheme
        id: xc
        run: |
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          echo "workspace=$WS" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Prebuild ExpoModulesJSI (device + simulator)
        # Expo builds this framework in a nested, quiet xcodebuild during the
        # app build, so its errors get buried. Building it here, on its own,
        # surfaces them; when it succeeds the app build reuses the result.
        shell: bash
        run: |
          set -o pipefail
          export PODS_ROOT="$GITHUB_WORKSPACE/ios/Pods"
          export DEVELOPER_DIR="$(xcode-select -p)"
          for platform in iphoneos iphonesimulator; do
            echo "::group::ExpoModulesJSI for $platform"
            if ! PLATFORM_NAME=$platform bash node_modules/expo-modules-jsi/apple/scripts/build-xcframework.sh 2>&1 | tee "jsi-$platform.log"; then
              echo "::endgroup::"
              grep -E "error|Error|failed|FAILED" "jsi-$platform.log" | head -30 | while IFS= read -r line; do
                echo "::error title=ExpoModulesJSI ($platform)::${line}"
              done
              exit 1
            fi
            echo "::endgroup::"
          done

      - name: Show the toolchain
        run: |
          xcodebuild -version
          echo "::notice title=Toolchain::$(xcodebuild -version | tr '\n' ' ') node $(node -v)"

      - name: Build for devices (unsigned) and package an IPA
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          fail() {
            # Logs need a GitHub sign-in to read; annotations do not.
            grep -E "error:|fatal error|The following build commands failed|xcodebuild: error" "$1" | head -25 | while IFS= read -r line; do
              echo "::error title=Xcode::${line}"
            done
            tail -n 60 "$1"
            exit 1
          }
          xcodebuild archive \
            -workspace "${{ steps.xc.outputs.workspace }}" \
            -scheme "${{ steps.xc.outputs.scheme }}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Altruist.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > build/device.log 2>&1 || fail build/device.log
          tail -n 20 build/device.log
          APP=$(ls -d build/Altruist.xcarchive/Products/Applications/*.app | head -1)
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          (cd build && zip -qry Altruist-unsigned.ipa Payload)

      - name: Check what is inside the IPA
        # A sideloaded app that opens and closes at once is usually missing
        # something here: an embedded framework, or the JS bundle. Reported
        # as annotations so it can be read without a GitHub sign-in.
        shell: bash
        run: |
          APP=$(ls -d build/Payload/*.app | head -1)
          BIN="$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          MIN=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")
          BUNDLE=$(ls -la "$APP/main.jsbundle" 2>/dev/null | awk '{print $5}')
          FRAMEWORKS=$(ls "$APP/Frameworks" 2>/dev/null | tr '\n' ' ')
          echo "::notice title=IPA::min iOS $MIN · main.jsbundle ${BUNDLE:-MISSING} bytes · Frameworks: ${FRAMEWORKS:-none}"
          # Every dynamic library the app needs at launch must ship inside it.
          missing=""
          for lib in $(otool -L "$BIN" | awk 'NR>1 && /@rpath/ {print $1}'); do
            name=${lib#@rpath/}
            [ -e "$APP/Frameworks/$name" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error title=IPA::Linked but not embedded (the app will crash at launch):$missing"
          else
            echo "::notice title=IPA::Every @rpath library the app links is embedded."
          fi
          [ -n "$BUNDLE" ] || echo "::error title=IPA::main.jsbundle is missing — the JS was not bundled into the release build."

      - name: Build for the iOS Simulator
        shell: bash
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace "${{ steps.xc.outputs.workspace }}" \
            -scheme "${{ steps.xc.outputs.scheme }}" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO \
            > build/sim.log 2>&1 || {
              grep -E "error:|fatal error|The following build commands failed" build/sim.log | head -25 | while IFS= read -r line; do
                echo "::error title=Xcode (simulator)::${line}"
              done
              exit 1
            }
          APP=$(ls -d build/sim/Build/Products/Release-iphonesimulator/*.app | head -1)
          (cd "$(dirname "$APP")" && zip -qry "$GITHUB_WORKSPACE/build/Altruist-simulator.zip" "$(basename "$APP")")

      - uses: actions/upload-artifact@v4
        with:
          name: altruist-ios-unsigned
          path: build/Altruist-unsigned.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: altruist-ios-simulator
          path: build/Altruist-simulator.zip
          if-no-files-found: error
